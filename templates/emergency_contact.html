<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RAHE - Emergency Contact</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(
                135deg,
                #ffe4ec,
                #fff5f7
            );
            min-height: 100vh;
        }

        .header {
            background: #d81b60;
            color: white;
            padding: 18px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .dashboard-btn {
            background: white;
            color: #d81b60;

            padding: 10px 18px;

            border-radius: 8px;

            text-decoration: none;

            font-weight: bold;
        }

        .container {

            min-height: calc(100vh - 70px);

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px;
        }

        .card {

            width: 450px;

            max-width: 95%;

            background: white;

            padding: 40px 30px;

            border-radius: 20px;

            text-align: center;

            box-shadow:
                0 10px 35px
                rgba(0,0,0,0.15);
        }

        .main-icon {
            font-size: 65px;
        }

        h1 {
            color: #d81b60;
            margin: 15px 0 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .emergency-btn {

            width: 100%;

            padding: 17px;

            margin: 10px 0;

            border: none;

            border-radius: 12px;

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .emergency-btn:hover {
            transform: scale(1.02);
        }

        .ambulance {
            background: #e53935;
        }

        .police {
            background: #1565c0;
        }

        .back {
            background: #555;
        }


        /* =========================================
           POPUP
        ========================================= */

        .popup-overlay {

            display: none;

            position: fixed;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            background: rgba(0,0,0,0.70);

            z-index: 99999;

            justify-content: center;

            align-items: center;
        }


        .popup-box {

            width: 400px;

            max-width: 90%;

            background: white;

            padding: 35px 25px;

            border-radius: 20px;

            text-align: center;

            box-shadow:
                0 15px 50px
                rgba(0,0,0,0.4);

            animation: popupAnimation
                       0.25s ease;
        }


        @keyframes popupAnimation {

            from {
                transform: scale(0.5);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }

        }


        .popup-icon {
            font-size: 65px;
        }


        .popup-title {

            font-size: 26px;

            font-weight: bold;

            margin-top: 10px;

            color: #d81b60;
        }


        .popup-number {

            font-size: 32px;

            font-weight: bold;

            margin: 15px 0;

        }


        .popup-message {

            color: #555;

            margin-bottom: 25px;

        }


        .close-btn {

            background: #555;

            color: white;

            border: none;

            padding: 12px 30px;

            border-radius: 8px;

            font-size: 16px;

            cursor: pointer;
        }


        .close-btn:hover {
            background: #333;
        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            🚑 RAHE
        </div>


        <a
            href="{{ url_for('dashboard') }}"
            class="dashboard-btn"
        >
            🏠 Dashboard
        </a>

    </div>



    <!-- MAIN -->

    <div class="container">

        <div class="card">

            <div class="main-icon">
                🚨
            </div>


            <h1>
                Emergency Contact
            </h1>


            <p class="subtitle">
                Select an emergency service
            </p>


            <!-- AMBULANCE -->

            <button
                type="button"
                class="emergency-btn ambulance"
                onclick="openAmbulancePopup()"
            >

                🚑 Ambulance - 108

            </button>



            <!-- POLICE -->

            <button
                type="button"
                class="emergency-btn police"
                onclick="openPolicePopup()"
            >

                👮 Police - 112

            </button>



            <!-- BACK -->

            <button
                type="button"
                class="emergency-btn back"
                onclick="goDashboard()"
            >

                ← Back to Dashboard

            </button>

        </div>

    </div>



    <!-- =========================================
         POPUP
    ========================================= -->

    <div
        id="emergencyPopup"
        class="popup-overlay"
    >

        <div class="popup-box">


            <div
                id="popupIcon"
                class="popup-icon"
            >
                🚨
            </div>


            <div
                id="popupTitle"
                class="popup-title"
            >
                Emergency
            </div>


            <div
                id="popupNumber"
                class="popup-number"
            >
                000
            </div>


            <div
                id="popupMessage"
                class="popup-message"
            >
                Emergency service selected.
            </div>


            <button
                type="button"
                class="close-btn"
                onclick="closePopup()"
            >

                Close

            </button>

        </div>

    </div>



    <!-- =========================================
         JAVASCRIPT
    ========================================= -->

    <script>

        function openAmbulancePopup() {

            document.getElementById(
                "popupIcon"
            ).innerHTML = "🚑";


            document.getElementById(
                "popupTitle"
            ).innerHTML =
                "Ambulance Emergency";


            document.getElementById(
                "popupNumber"
            ).innerHTML =
                "108";


            document.getElementById(
                "popupMessage"
            ).innerHTML =
                "Emergency Ambulance Number";


            document.getElementById(
                "emergencyPopup"
            ).style.display = "flex";

        }



        function openPolicePopup() {

            document.getElementById(
                "popupIcon"
            ).innerHTML = "👮";


            document.getElementById(
                "popupTitle"
            ).innerHTML =
                "Police Emergency";


            document.getElementById(
                "popupNumber"
            ).innerHTML =
                "112";


            document.getElementById(
                "popupMessage"
            ).innerHTML =
                "Emergency Police Number";


            document.getElementById(
                "emergencyPopup"
            ).style.display = "flex";

        }



        function closePopup() {

            document.getElementById(
                "emergencyPopup"
            ).style.display = "none";

        }



        function goDashboard() {

            window.location.href =
                "{{ url_for('dashboard') }}";

        }



        document
            .getElementById("emergencyPopup")
            .addEventListener(
                "click",
                function(event) {

                    if (event.target === this) {

                        closePopup();

                    }

                }
            );

    </script>


</body>

</html>
