<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RAHE - Emergency Contact</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #fff5f5,
                #ffe4e6
            );

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 92%;
            max-width: 500px;

            text-align: center;

            padding: 30px;
        }

        /* ================= LOGO ================= */

        .logo {
            font-size: 30px;
            font-weight: bold;

            color: #dc2626;

            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;

            font-size: 16px;

            margin-bottom: 30px;
        }

        /* ================= BUTTONS ================= */

        .emergency-btn {
            width: 100%;

            padding: 20px;

            margin: 12px 0;

            border: none;

            border-radius: 15px;

            color: white;

            font-size: 20px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 5px 15px
                rgba(0, 0, 0, 0.15);

            transition: 0.2s;
        }

        .emergency-btn:hover {
            transform: translateY(-3px);
        }

        .emergency-btn:active {
            transform: scale(0.97);
        }

        /* ================= AMBULANCE ================= */

        .ambulance {
            background: #16a34a;
        }

        .ambulance:hover {
            background: #15803d;
        }

        /* ================= POLICE ================= */

        .police {
            background: #2563eb;
        }

        .police:hover {
            background: #1d4ed8;
        }

        .icon {
            font-size: 30px;
            margin-right: 8px;
        }

        /* ================= POPUP ================= */

        .popup-overlay {
            display: none;

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background:
                rgba(0, 0, 0, 0.65);

            justify-content: center;
            align-items: center;

            z-index: 9999;
        }

        .popup {
            width: 90%;
            max-width: 420px;

            background: white;

            border-radius: 20px;

            padding: 30px;

            text-align: center;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.3);

            animation:
                popupShow 0.3s ease;
        }

        @keyframes popupShow {

            from {
                transform: scale(0.7);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }

        }

        .popup-icon {
            font-size: 65px;

            margin-bottom: 10px;
        }

        .popup h2 {
            margin: 10px 0;

            color: #222;
        }

        .popup p {
            color: #555;

            line-height: 1.6;
        }

        /* ================= NUMBER ================= */

        .number {
            font-size: 35px;

            font-weight: bold;

            margin: 20px 0;

            color: #dc2626;
        }

        /* ================= CALL ================= */

        .call-btn {
            display: block;

            width: 100%;

            padding: 14px;

            border-radius: 10px;

            border: none;

            background: #16a34a;

            color: white;

            font-size: 17px;

            font-weight: bold;

            text-decoration: none;

            cursor: pointer;
        }

        .call-btn:hover {
            background: #15803d;
        }

        /* ================= CLOSE ================= */

        .close-btn {
            width: 100%;

            padding: 13px;

            margin-top: 10px;

            border: none;

            border-radius: 10px;

            background: #6b7280;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .close-btn:hover {
            background: #4b5563;
        }

        /* ================= FOOTER ================= */

        .footer {
            margin-top: 25px;

            color: #777;

            font-size: 13px;
        }

    </style>

</head>


<body>


<div class="container">

    <!-- ================= HEADER ================= -->

    <div class="logo">
        🚑 RAHE
    </div>

    <div class="subtitle">

        📞 Emergency Contact

        <br>

        Quickly contact Ambulance,
        Police and Emergency services.

    </div>


    <!-- ================= AMBULANCE ================= -->

    <button
        class="emergency-btn ambulance"
        onclick="showAmbulance()"
    >

        <span class="icon">
            🚑
        </span>

        Ambulance : 108

    </button>


    <!-- ================= POLICE ================= -->

    <button
        class="emergency-btn police"
        onclick="showPolice()"
    >

        <span class="icon">
            👮
        </span>

        Police : 112

    </button>


    <!-- ================= FOOTER ================= -->

    <div class="footer">

        © 2026 RAHE - Road Accident Hospital Emergency

    </div>

</div>


<!-- ================================================= -->
<!-- POPUP -->
<!-- ================================================= -->

<div
    class="popup-overlay"
    id="popup"
>

    <div class="popup">

        <div
            class="popup-icon"
            id="popupIcon"
        >
            🚑
        </div>


        <h2 id="popupTitle">
            Ambulance
        </h2>


        <p id="popupMessage">
            Contact emergency service.
        </p>


        <div
            class="number"
            id="popupNumber"
        >
            108
        </div>


        <!-- CALL BUTTON -->

        <a
            id="callButton"
            class="call-btn"
            href="tel:108"
        >

            📞 Call Now

        </a>


        <!-- CLOSE -->

        <button
            class="close-btn"
            onclick="closePopup()"
        >

            Close

        </button>

    </div>

</div>


<script>


/* ================================================= */
/* AMBULANCE POPUP */
/* ================================================= */

function showAmbulance() {

    document.getElementById(
        "popupIcon"
    ).innerHTML = "🚑";


    document.getElementById(
        "popupTitle"
    ).innerHTML = "Ambulance";


    document.getElementById(
        "popupMessage"
    ).innerHTML =
        "For medical emergency assistance, call Ambulance immediately.";


    document.getElementById(
        "popupNumber"
    ).innerHTML = "108";


    document.getElementById(
        "callButton"
    ).href = "tel:108";


    document.getElementById(
        "callButton"
    ).innerHTML =
        "📞 Call Ambulance";


    document.getElementById(
        "popup"
    ).style.display = "flex";

}


/* ================================================= */
/* POLICE POPUP */
/* ================================================= */

function showPolice() {

    document.getElementById(
        "popupIcon"
    ).innerHTML = "👮";


    document.getElementById(
        "popupTitle"
    ).innerHTML = "Police";


    document.getElementById(
        "popupMessage"
    ).innerHTML =
        "For police emergency assistance, call Police immediately.";


    document.getElementById(
        "popupNumber"
    ).innerHTML = "112";


    document.getElementById(
        "callButton"
    ).href = "tel:112";


    document.getElementById(
        "callButton"
    ).innerHTML =
        "📞 Call Police";


    document.getElementById(
        "popup"
    ).style.display = "flex";

}


/* ================================================= */
/* CLOSE POPUP */
/* ================================================= */

function closePopup() {

    document.getElementById(
        "popup"
    ).style.display = "none";

}


/* ================================================= */
/* CLICK OUTSIDE POPUP */
/* ================================================= */

document
    .getElementById("popup")
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target === this
            ) {

                closePopup();

            }

        }
    );

</script>


</body>

</html>
