<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RAHE Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fff1f5, #ffe4ec);
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* MAIN CONTAINER */
        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        /* LOGIN CARD */
        .login-card {
            background: white;
            padding: 35px 30px;
            border-radius: 18px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);

            text-align: center;
        }

        /* LOGO */
        .logo {
            font-size: 48px;
            margin-bottom: 5px;
        }

        h1 {
            margin: 0;
            color: #d81b60;
            font-size: 32px;
        }

        .subtitle {
            margin-top: 8px;
            margin-bottom: 30px;
            color: #666;
            font-size: 15px;
        }

        /* FORM */
        .login-form {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px 14px;

            border: 1px solid #ccc;
            border-radius: 8px;

            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #d81b60;
            box-shadow: 0 0 5px rgba(216, 27, 96, 0.2);
        }

        /* LOGIN BUTTON */
        .login-btn {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 8px;

            background: #d81b60;
            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
            margin-top: 5px;
        }

        .login-btn:hover {
            background: #ad1457;
        }

        /* MESSAGE */
        .message {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 7px;
            font-size: 14px;
        }

        .message.error {
            background: #ffe5e5;
            color: #c62828;
        }

        .message.success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        /* REGISTER */
        .register-text {
            margin-top: 25px;
            color: #555;
            font-size: 15px;
        }

        .register-text a {
            color: #d81b60;
            text-decoration: none;
            font-weight: bold;
        }

        .register-text a:hover {
            text-decoration: underline;
        }

        /* BACK */
        .back {
            margin-top: 20px;
        }

        .back a {
            color: #1457a6;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }

        /* MOBILE */
        @media (max-width: 500px) {

            .login-container {
                padding: 15px;
            }

            .login-card {
                padding: 28px 20px;
            }

            h1 {
                font-size: 28px;
            }

            .logo {
                font-size: 42px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <!-- LOGO -->
            <div class="logo">
                🚑
            </div>

            <h1>RAHE Login</h1>

            <p class="subtitle">
                Login to access emergency hospital services
            </p>


            <!-- FLASH MESSAGES -->
            {% with messages = get_flashed_messages(with_categories=true) %}

                {% if messages %}

                    {% for category, message in messages %}

                        <div class="message {{ category }}">
                            {{ message }}
                        </div>

                    {% endfor %}

                {% endif %}

            {% endwith %}


            <!-- LOGIN FORM -->
            <form
                method="POST"
                action="{{ url_for('login') }}"
                class="login-form"
            >

                <!-- EMAIL -->
                <div class="form-group">

                    <label for="email">
                        📧 Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->
                <div class="form-group">

                    <label for="password">
                        🔒 Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- LOGIN BUTTON -->
                <button
                    type="submit"
                    class="login-btn"
                >
                    🔐 Login
                </button>

            </form>


            <!-- REGISTER -->
            <div class="register-text">

                Don't have an account?

                <a href="{{ url_for('register') }}">
                    Register
                </a>

            </div>


            <!-- BACK -->
            <div class="back">

                <a href="{{ url_for('index') }}">
                    ← Back to Home
                </a>

            </div>

        </div>

    </div>

</body>

</html>
