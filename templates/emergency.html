<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Emergency Contact - RAHE</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef5ff, #fff1f5);
            padding: 30px;
        }

        /* ================= HEADER ================= */

        .header {
            background: white;
            padding: 18px 30px;
            border-radius: 15px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            box-shadow: 0 5px 20px rgba(0,0,0,0.08);

            margin-bottom: 40px;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
            color: #1454a4;
        }

        .nav a {
            text-decoration: none;
            color: #1454a4;
            font-weight: bold;
            margin-left: 25px;
        }

        .nav a:hover {
            color: #e63946;
        }

        /* ================= MAIN ================= */

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .title {
            text-align: center;
            color: #164f9e;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 18px;
            margin-bottom: 35px;
        }

        /* ================= CARDS ================= */

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .card {
            background: white;
            padding: 35px 25px;
            border-radius: 20px;
            text-align: center;

            box-shadow: 0 8px 25px rgba(0,0,0,0.10);

            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.16);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .card h2 {
            color: #1454a4;
            margin-bottom: 15px;
        }

        .number {
            font-size: 32px;
            font-weight: bold;
            color: #d90429;
            margin-bottom: 20px;
        }

        /* ================= CALL BUTTON ================= */

        .call-btn {
            border: none;

            background: #d90429;
            color: white;

            padding: 12px 30px;

            border-radius: 30px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .call-btn:hover {
            background: #a90320;
            transform: scale(1.05);
        }

        /* ================= POPUP ================= */

        .popup-overlay {

            display: none;

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(0,0,0,0.65);

            justify-content: center;
            align-items: center;

            z-index: 9999;
        }

        .popup-box {

            background: white;

            width: 90%;
            max-width: 420px;

            padding: 35px;

            border-radius: 20px;

            text-align: center;

            box-shadow:
                0 15px 50px rgba(0,0,0,0.3);

            animation: popupAnimation 0.25s ease;
        }

        @keyframes popupAnimation {

            from {
                transform: scale(0.7);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .popup-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .popup-box h2 {
            color: #d90429;
            margin-bottom: 15px;
        }

        .popup-box p {
            color: #555;
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* ================= POPUP BUTTONS ================= */

        .popup-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .yes-btn,
        .cancel-btn {

            border: none;

            padding: 12px 22px;

            border-radius: 25px;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }

        .yes-btn {
            background: #198754;
            color: white;
        }

        .yes-btn:hover {
            background: #146c43;
        }

        .cancel-btn {
            background: #6c757d;
            color: white;
        }

        .cancel-btn:hover {
            background: #495057;
        }

        /* ================= BACK ================= */

        .back-btn {

            display: block;

            width: fit-content;

            margin: 40px auto 0;

            background: #1454a4;

            color: white;

            text-decoration: none;

            padding: 12px 30px;

            border-radius: 25px;

            font-weight: bold;
        }

        .back-btn:hover {
            background: #0d3d7a;
        }

        /* ================= MOBILE ================= */

        @media(max-width: 800px) {

            .cards {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                gap: 15px;
            }

            .nav a {
                margin: 0 8px;
            }

        }

    </style>

</head>


<body>


<!-- ================================================= -->
<!-- HEADER -->
<!-- ================================================= -->

<div class="header">

    <div class="logo">
        🚑 RAHE
    </div>

    <div class="nav">

        <a href="{{ url_for('dashboard') }}">
            Home
        </a>

        <a href="{{ url_for('hospital') }}">
            Hospital
        </a>

        <a href="{{ url_for('nearest') }}">
            Nearest
        </a>

        <a href="{{ url_for('logout') }}">
            Logout
        </a>

    </div>

</div>



<!-- ================================================= -->
<!-- MAIN -->
<!-- ================================================= -->

<div class="container">


    <h1 class="title">
        🚨 Emergency Contact
    </h1>


    <p class="subtitle">
        Select an emergency service to call.
    </p>



    <div class="cards">


        <!-- ================================================= -->
        <!-- AMBULANCE 108 -->
        <!-- ================================================= -->

        <div class="card">

            <div class="icon">
                🚑
            </div>

            <h2>
                Ambulance
            </h2>

            <div class="number">
                108
            </div>

            <button
                type="button"
                class="call-btn"
                onclick="openPopup('Ambulance', '108')">

                📞 Call

            </button>

        </div>



        <!-- ================================================= -->
        <!-- EMERGENCY 112 -->
        <!-- ================================================= -->

        <div class="card">

            <div class="icon">
                🚨
            </div>

            <h2>
                Emergency
            </h2>

            <div class="number">
                112
            </div>

            <button
                type="button"
                class="call-btn"
                onclick="openPopup('Emergency Service', '112')">

                📞 Call

            </button>

        </div>



        <!-- ================================================= -->
        <!-- POLICE 100 -->
        <!-- ================================================= -->

        <div class="card">

            <div class="icon">
                👮
            </div>

            <h2>
                Police
            </h2>

            <div class="number">
                100
            </div>

            <button
                type="button"
                class="call-btn"
                onclick="openPopup('Police', '100')">

                📞 Call

            </button>

        </div>


    </div>



    <!-- ================================================= -->
    <!-- BACK -->
    <!-- ================================================= -->

    <a
        href="{{ url_for('dashboard') }}"
        class="back-btn">

        ← Back to Dashboard

    </a>


</div>



<!-- ================================================= -->
<!-- POPUP -->
<!-- ================================================= -->

<div
    id="callPopup"
    class="popup-overlay">


    <div class="popup-box">


        <div class="popup-icon">
            🚨
        </div>


        <h2 id="popupTitle">
            Emergency Call
        </h2>


        <p id="popupMessage">
            Are you sure you want to call?
        </p>


        <div class="popup-buttons">


            <button
                type="button"
                class="yes-btn"
                onclick="makeCall()">

                📞 Yes, Call

            </button>


            <button
                type="button"
                class="cancel-btn"
                onclick="closePopup()">

                ❌ Cancel

            </button>


        </div>


    </div>


</div>



<!-- ================================================= -->
<!-- JAVASCRIPT -->
<!-- ================================================= -->

<script>

let selectedNumber = "";


/* ================= OPEN POPUP ================= */

function openPopup(service, number) {

    selectedNumber = number;

    document.getElementById(
        "popupTitle"
    ).innerText =
        service + " Emergency";


    document.getElementById(
        "popupMessage"
    ).innerText =

        "Are you sure you want to call "
        + service
        + " on "
        + number
        + "?";


    document.getElementById(
        "callPopup"
    ).style.display = "flex";

}


/* ================= CLOSE POPUP ================= */

function closePopup() {

    document.getElementById(
        "callPopup"
    ).style.display = "none";

}


/* ================= MAKE CALL ================= */

function makeCall() {

    if (selectedNumber !== "") {

        window.location.href =
            "tel:" + selectedNumber;

    }

}


/* ================= CLICK OUTSIDE ================= */

document.getElementById(
    "callPopup"
).addEventListener(
    "click",
    function(event) {

        if (
            event.target ===
            document.getElementById("callPopup")
        ) {

            closePopup();

        }

    }
);

</script>


</body>

</html>
