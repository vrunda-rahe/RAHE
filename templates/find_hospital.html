<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Find Hospital</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>


<nav class="navbar">

    <div class="logo">
        🚑 RAHE
    </div>

    <div class="nav-links">

        <a href="{{ url_for('dashboard') }}">
            Home
        </a>

        <a href="{{ url_for('logout') }}">
            Logout
        </a>

    </div>

</nav>


<div class="main-container">

    <div class="page-header">

        <h1>
            🏥 Find Hospital
        </h1>

        <p>
            Available hospitals in Maharashtra
        </p>

    </div>


    <div class="hospital-grid">

        {% for hospital in hospitals %}

        <div class="hospital-card">

            <h3>
                🏥 {{ hospital["hospital_name"] }}
            </h3>

            <p>
                📍 {{ hospital["address"] }}
            </p>

            <p>
                🏙️ {{ hospital["city"] }}
            </p>

            <p>
                🚨 Emergency Beds:
                <strong>{{ hospital["emergency_beds"] }}</strong>
            </p>

            <a
                href="{{ url_for('hospital_details', hospital_id=hospital['id']) }}"
                class="location-btn">

                View Details

            </a>

        </div>

        {% endfor %}

    </div>

</div>


</body>
</html>
