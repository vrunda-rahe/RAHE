<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RAHE - Create Account</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }


        body {

            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #fff1f5,
                #ffe4ec
            );

            display: flex;

            justify-content: center;

            align-items: center;

        }


        /* =========================================
           MAIN CONTAINER
        ========================================= */

        .container {

            width: 100%;

            max-width: 430px;

            padding: 20px;

            margin: auto;

        }


        /* =========================================
           CARD
        ========================================= */

        .card {

            width: 100%;

            background: white;

            padding: 35px 30px;

            border-radius: 18px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.15);

            text-align: center;

        }


        /* =========================================
           LOGO
        ========================================= */

        .logo {

            font-size: 50px;

            margin-bottom: 8px;

        }


        /* =========================================
           TITLE
        ========================================= */

        h1 {

            margin: 0;

            color: #d81b60;

            font-size: 32px;

        }


        .subtitle {

            margin-top: 10px;

            margin-bottom: 28px;

            color: #666;

            font-size: 15px;

            line-height: 1.5;

        }


        /* =========================================
           FORM
        ========================================= */

        .register-form {

            width: 100%;

            display: flex;

            flex-direction: column;

            align-items: stretch;

        }


        /* =========================================
           FORM GROUP
        ========================================= */

        .form-group {

            width: 100%;

            margin-bottom: 18px;

            text-align: left;

        }


        label {

            display: block;

            margin-bottom: 7px;

            color: #333;

            font-size: 15px;

            font-weight: bold;

        }


        /* =========================================
           INPUT
        ========================================= */

        input {

            display: block;

            width: 100%;

            height: 48px;

            padding: 12px 14px;

            border: 1px solid #ccc;

            border-radius: 8px;

            outline: none;

            font-size: 15px;

            font-family: Arial, sans-serif;

            background: #fff;

        }


        input:focus {

            border-color: #d81b60;

            box-shadow:
                0 0 5px rgba(
                    216,
                    27,
                    96,
                    0.20
                );

        }


        input::placeholder {

            color: #999;

        }


        /* =========================================
           REGISTER BUTTON
        ========================================= */

        .register-btn {

            display: block;

            width: 100%;

            height: 50px;

            margin-top: 3px;

            border: none;

            border-radius: 8px;

            background: #d81b60;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            font-family: Arial, sans-serif;

        }


        .register-btn:hover {

            background: #ad1457;

        }


        /* =========================================
           FLASH MESSAGE
        ========================================= */

        .message {

            width: 100%;

            padding: 11px;

            margin-bottom: 18px;

            border-radius: 7px;

            font-size: 14px;

            text-align: center;

        }


        .message.error {

            background: #ffe5e5;

            color: #c62828;

        }


        .message.success {

            background: #e8f5e9;

            color: #2e7d32;

        }


        /* =========================================
           LOGIN LINK
        ========================================= */

        .login-text {

            margin-top: 24px;

            color: #555;

            font-size: 15px;

        }


        .login-text a {

            color: #d81b60;

            text-decoration: none;

            font-weight: bold;

        }


        .login-text a:hover {

            text-decoration: underline;

        }


        /* =========================================
           BACK HOME
        ========================================= */

        .back {

            margin-top: 18px;

        }


        .back a {

            color: #1457a6;

            text-decoration: none;

            font-size: 14px;

            font-weight: bold;

        }


        .back a:hover {

            text-decoration: underline;

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 500px) {

            body {

                align-items: center;

            }


            .container {

                padding: 15px;

            }


            .card {

                padding: 30px 22px;

            }


            h1 {

                font-size: 28px;

            }


            .logo {

                font-size: 44px;

            }

        }

    </style>

</head>


<body>


    <div class="container">


        <div class="card">


            <!-- LOGO -->

            <div class="logo">
                👤
            </div>


            <!-- TITLE -->

            <h1>
                Create Account
            </h1>


            <p class="subtitle">
                Register for RAHE emergency services
            </p>


            <!-- FLASH MESSAGES -->

            {% with messages = get_flashed_messages(
                with_categories=true
            ) %}

                {% if messages %}

                    {% for category, message in messages %}

                        <div class="message {{ category }}">
                            {{ message }}
                        </div>

                    {% endfor %}

                {% endif %}

            {% endwith %}


            <!-- REGISTER FORM -->

            <form
                method="POST"
                action="{{ url_for('register') }}"
                class="register-form"
            >


                <!-- FULL NAME -->

                <div class="form-group">

                    <label for="name">
                        👤 Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        📧 Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        🔒 Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create your password"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <!-- REGISTER -->

                <button
                    type="submit"
                    class="register-btn"
                >
                    📝 Register
                </button>


            </form>


            <!-- LOGIN -->

            <div class="login-text">

                Already have an account?

                <a href="{{ url_for('login') }}">
                    Login
                </a>

            </div>


            <!-- BACK -->

            <div class="back">

                <a href="{{ url_for('index') }}">
                    ← Back to Home
                </a>

            </div>


        </div>

    </div>


</body>

</html>
